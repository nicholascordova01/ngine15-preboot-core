name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No cache: intentionally omitted to prevent stale-cache risk on release builds

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify tag matches HEAD
        run: |
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME points to $TAG_SHA but HEAD is $HEAD_SHA"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME correctly points to $HEAD_SHA"

      - name: Package release artifact
        run: |
          mkdir -p dist
          tar -czf dist/ngine15-preboot-core-${{ github.ref_name }}.tar.gz \
            --exclude='.git' \
            --exclude='dist' \
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/ngine15-preboot-core-${{ github.ref_name }}.tar.gz
